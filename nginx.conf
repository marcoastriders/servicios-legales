map $host $site_dir {
  default "burofaxlegal.es";
  "burofaxlegal.es" "burofaxlegal.es";
  "www.burofaxlegal.es" "burofaxlegal.es";
  "revisioncontratos.es" "revisioncontratos.es";
  "www.revisioncontratos.es" "revisioncontratos.es";
}

# www -> dominio raíz
server {
  listen 80;
  server_name www.burofaxlegal.es www.revisioncontratos.es;
  return 301 https://$host$request_uri;
}

server {
  listen 80 default_server;
  server_name burofaxlegal.es revisioncontratos.es;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location / {
    root /usr/share/nginx/html/$site_dir;
    try_files $uri $uri/ $uri/index.html =404;
  }

  location = /assets/styles.css {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    root /usr/share/nginx/html/$site_dir;
    internal;
  }
}
